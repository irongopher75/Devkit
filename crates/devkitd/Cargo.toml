[package]
name = "devkitd"
version = "0.1.0"
edition = "2021"
description = "Local dev cockpit: process supervisor, connection probes, and traffic recorder for one project"
license = "MIT"

[[bin]]
name = "devkit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
portable-pty = "0.8"
rust-embed = "8"
mime_guess = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
